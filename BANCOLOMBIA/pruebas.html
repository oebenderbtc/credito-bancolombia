<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Bancolombia</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }

        .form-container {
            width: 300px;
        }

        .form-group {
            margin-bottom: 30px;
        }

        .form-label {
            display: flex;
            align-items: center;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .form-label i {
            margin-right: 10px;
        }

        .form-input {
            border: none;
            border-bottom: 1px solid #333;
            width: 100%;
            padding: 5px;
            font-size: 16px;
            outline: none;
        }

        .link {
            font-size: 14px;
            margin-top: 5px;
            display: inline-block;
            text-decoration: none;
            color: black;
            font-weight: bold;
        }

        .link:hover {
            text-decoration: underline;
        }

        .login-button {
            width: 100%;
            padding: 15px;
            background-color: #dcdcdc;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            color: #888;
            cursor: not-allowed;
        }

        .create-user {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }

        .create-user a {
            text-decoration: none;
            color: black;
        }

        .create-user a:hover {
            text-decoration: underline;
        }
    </style>
    <!-- Puedes usar una librería como Font Awesome para los íconos si deseas -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="form-container">
        <div class="form-group">
            <label class="form-label"><i class="fa fa-user"></i>Usuario</label>
            <input type="text" class="form-input" disabled>
            <a href="#" class="link">¿Olvidaste tu usuario?</a>
        </div>

        <div class="form-group">
            <label class="form-label"><i class="fa fa-lock"></i>Clave del cajero</label>
            <input type="password" class="form-input" disabled>
            <a href="#" class="link">¿Olvidaste tu clave?</a>
        </div>

        <button class="login-button" disabled>Iniciar sesión</button>

        <div class="create-user">
            <a href="#">Crear usuario</a>
        </div>
    </div>
</body>
</html>
