  <style>
    .boton-credito-container {
      align-items: center;
      justify-content: center;
      padding-bottom: 3%;
      border-top: 1px solid #ccc;
    }

    .boton-credito {
      display: flex;
      align-items: center;
      font-weight: bold;
      color: #1a1a1a;
      font-family: sans-serif;
      cursor: pointer;
      font-size: 30px;
      margin-left: 350px;
      text-decoration: none; /* Para que no se subraye */
    }

    .boton-credito .icono {
      background-color: #FFD600;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 10px;
    }

    .boton-credito .icono svg {
      width: 16px;
      height: 16px;
      fill: #000;
    }
  </style>
</head>
